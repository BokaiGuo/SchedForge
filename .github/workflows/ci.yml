name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            llvm-18-dev llvm-18-runtime llvm-18-tools clang-18

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test native backend
        run: ./build/schedforge-run --backend=native --M=33 --N=35 --K=31

      - name: Smoke test LLVM backend
        run: ./build/schedforge-run --backend=llvm --M=32 --N=32 --K=32

      - name: Verify full and sampled LoopIR simulation
        run: |
          ./build/schedforge-sim --M=65 --N=67 --K=63 > build/full-sim.txt
          grep -q "simulated extent: 65x67x63" build/full-sim.txt
          ./build/schedforge-sim --M=65 --N=67 --K=63 --sample-max=16 > build/sampled-sim.txt
          grep -q "simulated extent: 16x16x16" build/sampled-sim.txt

      - name: Smoke test StableHLO graph compiler
        run: |
          ./build/schedforge-compile examples/transformer_mlp.mlir \
            --batch=1 --sequence=4 --hidden=64 --intermediate=128 \
            --threads=2 -o build/transformer_mlp.sfe
          test -s build/transformer_mlp.sfe
          grep -q "scheduled_loop @dispatch_0" build/transformer_mlp.sfe
          grep -q "epilogue.gelu" build/transformer_mlp.sfe
          grep -q "epilogue.add_residual" build/transformer_mlp.sfe

      - name: Smoke test MoE compiler and runtime
        run: |
          ./build/schedforge-moe \
            --tokens=16 --hidden=16 --intermediate=32 \
            --experts=4 --top-k=2 --threads=2 \
            --routing=heavy --strategy=auto \
            --repetitions=2 -o build/moe_mlp.sfe
          grep -q "moe.histogram" build/moe_mlp.sfe
          grep -q "!sfg.segmented_tensor" build/moe_mlp.sfe
          grep -q "moe.schedule" build/moe_mlp.sfe
          grep -q "vector.fma" build/moe_mlp.sfe

      - name: Smoke test attention compiler and runtime
        run: |
          ./build/schedforge-attention \
            --batch=1 --q-heads=4 --kv-heads=2 \
            --sq=16 --sk=16 --head-dim=16 --value-dim=16 \
            --causal --threads=2 --strategy=io-aware \
            --qtile=8 --kvtile=8 --repetitions=2 \
            -o build/attention.sfe
          grep -q "attention.sdpa" build/attention.sfe
          grep -q "tile.pipeline @attention" build/attention.sfe
          grep -q "attention.online_softmax" build/attention.sfe
          grep -q "llvm.fma" build/attention.sfe

      - name: Smoke test full decoder layer compiler
        run: |
          ./build/schedforge-decoder examples/decoder_layer.mlir \
            --batch=1 --sequence=4 --hidden=16 --intermediate=32 \
            --q-heads=4 --kv-heads=2 --head-dim=4 --threads=2 \
            --repetitions=1 -o build/decoder.sfe
          grep -q "tensor.fused_qkv" build/decoder.sfe
          grep -q "tensor.fused_gate_up" build/decoder.sfe
          grep -q "attention.online_softmax" build/decoder.sfe
          grep -q "constant @packed_qkv_weight" build/decoder.sfe
          ./build/schedforge-decoder examples/decoder_layer_moe.mlir --moe \
            --batch=1 --sequence=4 --hidden=16 --intermediate=32 \
            --q-heads=4 --kv-heads=2 --head-dim=4 \
            --experts=4 --top-k=2 --threads=2 --repetitions=1 \
            -o build/decoder_moe.sfe
          grep -q "moe.combine" build/decoder_moe.sfe

      - name: Smoke test realistic decoder benchmark and planner
        run: |
          ./build/schedforge-decoder-bench --suite=realistic \
            --filter=tiny-decode-kv128 --threads=2 --repetitions=1 \
            --max-real-gflop=0.01 --max-weight-mib=32 \
            --output=build/decoder_realistic.csv
          grep -q "tokens_per_second" build/decoder_realistic.csv
          grep -q "measured" build/decoder_realistic.csv
          ./build/schedforge-decoder-bench --suite=optimizer \
            --filter=tiny-decode-kv512 --threads=2 --repetitions=1 \
            --max-real-gflop=0.01 --max-weight-mib=32 \
            --output=build/decoder_optimizer.csv
          grep -q "optimizer_baseline_ms" build/decoder_optimizer.csv
          grep -q "analytical_score" build/decoder_optimizer_candidates.csv

      - name: Smoke test production LLVM and fused Attention
        run: |
          ./build/schedforge-run --backend=llvm --M=17 --N=19 --K=13 \
            '--schedule=order=ikj;outer=64,128,64;tile=32,64,32;micro=4,8;vector=8;unroll=1;threads=3;pack=none;prefetch=0;fuse=true'
          ./build/schedforge-attention --fused-llvm --batch=1 \
            --q-heads=4 --kv-heads=2 --sq=5 --sk=7 \
            --head-dim=8 --value-dim=8 --threads=2 \
            --strategy=io-aware --repetitions=1 -o build/fused_attention.sfe
          ./build/schedforge-codegen-study --threads=2 --repetitions=1 \
            --output=build/codegen.csv --attention-output=build/fused_attention.csv
          grep -q "native_gflops_over_llvm" build/codegen.csv
          grep -q "llvm_speed_fraction" build/fused_attention.csv

      - name: Smoke test v0.12-v0.18 runtime line
        run: |
          ./build/schedforge-next-study --quick
          test -s results/next_milestones.csv
          grep -q ",1,0$" results/next_milestones.csv
          /usr/bin/clang++-18 -target aarch64-linux-gnu -march=armv8-a+simd \
            -ffreestanding -fsyntax-only results/generated_neon_matmul.cpp
          ./build/schedforge-fuzz --iterations=128 --seed=17

      - name: Run AArch64 NEON runtime smoke under QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user binutils-aarch64-linux-gnu
          ./scripts/run_neon_qemu.sh
