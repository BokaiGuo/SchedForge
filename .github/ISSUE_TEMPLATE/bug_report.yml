name: Bug report
description: Report a reproducible SchedForge defect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands, matrix sizes, schedule, and backend.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, CPU, compiler, LLVM version, and CMake version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or generated IR
      render: text
