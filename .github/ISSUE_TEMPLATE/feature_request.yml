name: Feature request
description: Propose a compiler, simulator, backend, or runtime improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which compiler or research problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed design
      description: Explain the affected IR, schedule, simulator, backend, and tests.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation plan
      description: Describe correctness and performance evidence.
